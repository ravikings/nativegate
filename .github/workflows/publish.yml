name: Publish to PyPI

on:
  release:
    types: [published]
  # Lets you manually run build end to end (Actions tab > this workflow >
  # Run workflow) without cutting a real release. check-version is skipped
  # (there's no release tag to check against) and publish never runs outside
  # a real `release: published` event, so a manual run can't accidentally
  # push a package to PyPI.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-version:
    name: Check version matches release tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare package version to the release tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # The version is single-sourced in tools/nativegate/pyproject.toml
          # ([project] version, static). Read it with tomllib without
          # importing the package.
          PKG_VERSION="$(python -c '
          import sys, tomllib
          with open("tools/nativegate/pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          print(project["version"])
          ')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '${TAG_VERSION}') does not match tools/nativegate/pyproject.toml version '${PKG_VERSION}'"
            exit 1
          fi

  test:
    # A release cut from a ref with failing tests must not reach PyPI, even
    # though CI already ran on the branch — the release event is the gate.
    # Linux only: this mirrors the fastest CI leg; the full os×python matrix
    # already ran on the pushed ref via ci.yml.
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/nativegate/pyproject.toml

      # The suite compiles real extension modules: f2py needs a Fortran
      # compiler, and the scikit-build-core path needs cmake + ninja.
      # Identical to ci.yml's Linux toolchain step on purpose — chicken not
      # eggs.
      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake ninja-build

      - name: Install nativegate with extras
        working-directory: tools/nativegate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[clang,fparser,build,test]"

      - name: Run the test suite
        working-directory: tools/nativegate
        run: python -m pytest -q

  build:
    name: Build distribution
    needs: [check-version]
    # check-version only runs (and must pass) for a real release; a manual
    # workflow_dispatch run leaves it skipped rather than failed, and build
    # should still go ahead in that case so it's actually testable on demand.
    # Allowlisted, not blocklisted (!= 'failure' alone would also admit a
    # 'cancelled' check-version): only 'success' (a real release, check
    # passed) or 'skipped' (workflow_dispatch, nothing to check) let build
    # proceed.
    if: "!cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')"
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to PyPI
    # success() is explicit, not implicit: a custom if: on a job replaces
    # GitHub's default "only run if needs succeeded" check rather than
    # adding to it, so without this, publish could run even if build/test
    # failed as long as the event was a release. Real releases only — never
    # on a manual workflow_dispatch run, so triggering this workflow by hand
    # to sanity-check the pipeline can never accidentally push to PyPI.
    if: success() && github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build, test]
    environment:
      name: pypi
      url: https://pypi.org/project/nativegate/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # SHA-pinned (not the mutable release/v1 branch): this step holds OIDC
      # publish rights, so the exact code it runs must be immutable.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
